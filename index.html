<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psicóloga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --noite:#132644; --marinho:#1f3a5f; --azul:#3f6a9e; --ceu:#8cc8f5; --agua:#8fdde0;
  --dourado:#e6c98f; --dourado-esc:#c9a45c; --creme:#f8f3ea;
  --texto-claro:rgba(255,255,255,.82);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,sans-serif;color:#fff;min-height:100vh;overflow-x:hidden;
  background:linear-gradient(180deg,var(--noite) 0%,var(--marinho) 45%,#2c5585 100%);background-attachment:fixed}
.pagina{position:relative;max-width:430px;margin:0 auto;padding:0 18px 140px}

/* ---------- FUNDO: brilho, ondas, folhas, estrelinhas ---------- */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.brilho{position:absolute;left:50%;top:22%;width:520px;height:520px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(143,221,224,.55),rgba(63,106,158,.25) 45%,transparent 70%);animation:respira 8s ease-in-out infinite}
@keyframes respira{50%{transform:translate(-50%,-50%) scale(1.15);opacity:.8}}
.ondas{position:absolute;left:0;bottom:0;width:100%;height:210px}
.ondas svg{position:absolute;bottom:0;left:0;width:200%;height:100%;animation:mar linear infinite}
.ondas svg:nth-child(1){animation-duration:22s;opacity:.35;bottom:40px}
.ondas svg:nth-child(2){animation-duration:15s;animation-direction:reverse;opacity:.45;bottom:14px}
.ondas svg:nth-child(3){animation-duration:10s;opacity:.9}
@keyframes mar{to{transform:translateX(-50%)}}
.ondas-topo{position:absolute;top:-30px;right:-40px;width:260px;opacity:.35;animation:gira-lento 40s linear infinite}
@keyframes gira-lento{to{transform:rotate(360deg)}}
.folha-deco{position:absolute;width:var(--t,60px);opacity:var(--o,.5);animation:balanca var(--v,9s) ease-in-out infinite;transform-origin:20% 80%}
@keyframes balanca{0%,100%{transform:rotate(var(--r,0deg)) translateY(0)}50%{transform:rotate(calc(var(--r,0deg) + 12deg)) translateY(-14px)}}
.estrela{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--dourado);box-shadow:0 0 8px 2px rgba(230,201,143,.6);animation:pisca 3s ease-in-out infinite}
@keyframes pisca{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}

/* entrada */
.surge{opacity:0;transform:translateY(20px);animation:surge .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*110ms + 100ms)}
@keyframes surge{to{opacity:1;transform:none}}

/* ---------- HERO ---------- */
.hero{position:relative;z-index:1;text-align:center;margin:0 -18px}
.hero-foto{position:relative;height:430px;overflow:hidden}
.hero-foto img{width:100%;height:100%;object-fit:cover;object-position:center 15%;
  -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 98%);mask-image:linear-gradient(180deg,#000 55%,transparent 98%);
  animation:zoom 16s ease-in-out infinite alternate}
@keyframes zoom{to{transform:scale(1.07)}}
.hero-foto:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(19,38,68,.35),transparent 30%)}
.arco{position:absolute;left:50%;top:40px;width:300px;height:380px;transform:translateX(-50%);border:1.5px solid rgba(230,201,143,.75);border-radius:150px 150px 0 0;z-index:2;
  -webkit-mask-image:linear-gradient(180deg,#000 50%,transparent 85%);mask-image:linear-gradient(180deg,#000 50%,transparent 85%)}
.arco:after{content:"";position:absolute;inset:10px;border:1px solid rgba(230,201,143,.35);border-radius:140px 140px 0 0}
.selo-crp{position:absolute;right:22px;top:24px;z-index:3;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;background:rgba(19,38,68,.55);backdrop-filter:blur(8px);border:1px solid rgba(230,201,143,.5);color:var(--dourado);padding:6px 11px;border-radius:99px}
.nome{position:relative;z-index:3;margin-top:-120px;font-family:"Cormorant Garamond",serif;line-height:.9;text-shadow:0 6px 24px rgba(10,20,40,.6)}
.nome .n1{display:block;font-size:58px;font-weight:600;letter-spacing:-.01em}
.nome .n2{display:block;font-size:58px;font-weight:600;font-style:italic;color:var(--dourado)}
.prof{position:relative;z-index:3;margin-top:10px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--texto-claro)}
.linha-ouro{width:64px;height:1px;margin:16px auto;background:linear-gradient(90deg,transparent,var(--dourado),transparent)}
.frase{font:italic 500 20px/1.35 "Cormorant Garamond",serif;max-width:300px;margin:0 auto;color:#fff}
.frase b{color:var(--dourado);font-weight:600}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;margin-top:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:6px 13px;border-radius:99px;color:var(--texto-claro)}
.status i{width:7px;height:7px;border-radius:50%;background:#6ee7a0;animation:pulsa 2s infinite}
@keyframes pulsa{0%{box-shadow:0 0 0 0 #6ee7a0aa}70%{box-shadow:0 0 0 8px #6ee7a000}100%{box-shadow:0 0 0 0 #6ee7a000}}
.icones{display:flex;justify-content:center;gap:12px;margin-top:18px}
.icones a{width:44px;height:44px;border-radius:50%;border:1px solid rgba(230,201,143,.6);display:grid;place-items:center;color:var(--dourado);transition:.3s}
.icones a:hover{background:var(--dourado);color:var(--marinho);transform:translateY(-3px)}
.icones svg{width:19px;height:19px}

/* ---------- CARTÕES ---------- */
.cartoes{position:relative;z-index:1;display:grid;gap:26px;margin-top:38px}
.cartao{position:relative;display:block;width:100%;min-height:128px;text-align:left;font:inherit;cursor:pointer;border:0;color:var(--marinho);
  background:var(--creme);border-radius:22px;padding:20px 46% 18px 20px;box-shadow:0 22px 40px -22px rgba(5,15,35,.9),inset 0 0 0 1px rgba(201,164,92,.35);
  transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.cartao.inv{padding:20px 20px 18px 46%;text-align:right}
.cartao:hover{transform:translateY(-5px) rotate(-.4deg)}
.cartao:active{transform:scale(.98)}
.cartao .t1{display:block;font:700 26px/1 "Cormorant Garamond",serif}
.cartao .t2{display:block;font:italic 600 25px/1.05 "Cormorant Garamond",serif;color:var(--azul);margin-top:2px}
.cartao .desc{display:block;font-size:12px;line-height:1.45;color:#5d6d80;margin-top:6px}
.cartao .acao{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;font-weight:600;color:var(--marinho);
  background:linear-gradient(120deg,var(--dourado),#f3e0b4,var(--dourado-esc));background-size:200% 100%;padding:7px 15px;border-radius:99px;animation:ouro 4s ease-in-out infinite;box-shadow:0 6px 14px -8px rgba(160,120,50,.9)}
.cartao .acao:after{content:"→";transition:transform .3s}
.cartao:hover .acao:after{transform:translateX(4px)}
@keyframes ouro{50%{background-position:100% 0}}
.cartao .img{position:absolute;right:-8px;top:-18px;bottom:-10px;width:44%;border-radius:20px;overflow:hidden;border:4px solid #fff;box-shadow:0 18px 30px -14px rgba(5,15,35,.8);transform:rotate(3deg);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.cartao.inv .img{right:auto;left:-8px;transform:rotate(-3deg)}
.cartao.redondo .img{border-radius:50%;width:132px;height:132px;top:50%;bottom:auto;margin-top:-66px;right:-14px}
.cartao:hover .img{transform:rotate(0) scale(1.04)}
.cartao .img img{width:100%;height:100%;object-fit:cover}
.cartao .folhinha{position:absolute;width:54px;top:-24px;left:44%;transform:rotate(-20deg);animation:balanca 6s ease-in-out infinite;--r:-20deg}

/* ---------- SOBRE ---------- */
.sobre{position:relative;z-index:1;margin-top:40px;text-align:center;padding:30px 22px 26px;border-radius:26px;
  background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(230,201,143,.35);backdrop-filter:blur(6px)}
.sobre h2{font:italic 600 40px/1 "Cormorant Garamond",serif;color:var(--dourado)}
.sobre p{font-size:14.5px;line-height:1.65;color:var(--texto-claro);margin-top:12px}
.temas{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:16px}
.tema{font-size:12.5px;padding:6px 12px;border-radius:99px;border:1px solid rgba(230,201,143,.45);color:#fff}
.assinatura{font:italic 600 28px "Cormorant Garamond",serif;color:var(--dourado);margin-top:16px}

.rodape{position:relative;z-index:1;text-align:center;font-size:11.5px;color:var(--texto-claro);margin-top:26px;line-height:1.7}
.crise{display:block;background:rgba(19,38,68,.6);border:1px solid rgba(230,201,143,.3);border-radius:14px;padding:9px 12px;margin-bottom:10px;color:#fff}

/* ---------- PAINEL QUE SOBE ---------- */
.veu{position:fixed;inset:0;background:rgba(8,18,35,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:10}
.veu.on{opacity:1;pointer-events:auto}
.folha{position:fixed;left:50%;bottom:0;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:var(--creme);color:#22384f;border-radius:28px 28px 0 0;padding:12px 22px 30px;z-index:11;
  transform:translate(-50%,105%);transition:transform .5s cubic-bezier(.2,.9,.25,1);border-top:3px solid var(--dourado)}
.folha.on{transform:translate(-50%,0)}
.alca{width:42px;height:5px;border-radius:9px;background:#d8cdb8;margin:0 auto 14px}
.fechar{position:absolute;right:16px;top:14px;width:34px;height:34px;border-radius:50%;border:0;background:#ece3d2;color:#22384f;font-size:18px;cursor:pointer}
.folha h3{font:700 30px "Cormorant Garamond",serif;color:var(--marinho)}
.folha h3 i{color:var(--azul)}
.folha h4{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dourado-esc);margin:20px 0 8px}
.folha p{font-size:14.5px;line-height:1.6;color:#41566c}
.folha .conteudo>*{opacity:0;transform:translateY(10px)}
.folha.on .conteudo>*{animation:surge .5s cubic-bezier(.2,.8,.2,1) forwards}
.folha.on .conteudo>*:nth-child(2){animation-delay:.05s}.folha.on .conteudo>*:nth-child(3){animation-delay:.1s}
.folha.on .conteudo>*:nth-child(4){animation-delay:.15s}.folha.on .conteudo>*:nth-child(5){animation-delay:.2s}
.folha.on .conteudo>*:nth-child(n+6){animation-delay:.25s}
.modos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modo{background:#fff;border:1px solid #eadfcb;border-radius:16px;padding:13px}
.modo b{display:block;font-size:14px;color:var(--marinho)}
.modo span{font-size:12.5px;color:#6b7f94}
details{background:#fff;border:1px solid #eadfcb;border-radius:14px;margin-bottom:8px}
summary{list-style:none;cursor:pointer;padding:12px 15px;font-size:14px;font-weight:500;display:flex;justify-content:space-between;gap:10px;color:var(--marinho)}
summary::-webkit-details-marker{display:none}
summary:after{content:"";width:8px;height:8px;flex:none;margin-top:4px;border-right:2px solid var(--dourado-esc);border-bottom:2px solid var(--dourado-esc);transform:rotate(45deg);transition:.3s}
details[open] summary:after{transform:rotate(-135deg)}
details p{padding:0 15px 13px;font-size:13.5px}
input,textarea{width:100%;font:15px Inter,sans-serif;padding:13px 15px;border:1px solid #e3d8c4;border-radius:14px;background:#fff;color:#22384f;transition:.2s}
input:focus,textarea:focus{outline:0;border-color:var(--azul);box-shadow:0 0 0 4px rgba(63,106,158,.15)}
textarea{min-height:72px;resize:none;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip input{position:absolute;width:1px;height:1px;clip:rect(0 0 0 0);overflow:hidden}
.chip span{display:inline-block;font-size:13.5px;padding:8px 14px;border-radius:99px;background:#fff;border:1px solid #e3d8c4;cursor:pointer;color:#22384f;transition:all .25s cubic-bezier(.5,1.6,.4,.9)}
.chip input:checked+span{background:var(--marinho);border-color:var(--marinho);color:var(--dourado);transform:scale(1.05)}
.chat{margin-top:16px;background:#e9e2d8;border-radius:18px;padding:12px}
.chat small{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#6b6257;margin-bottom:8px}
.chat small i{width:7px;height:7px;border-radius:50%;background:#25d366}
.balao{margin-left:auto;width:fit-content;max-width:92%;background:#d9fdd3;border-radius:14px 14px 4px 14px;padding:9px 12px;font-size:13.5px;white-space:pre-wrap;color:#1f3d25;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.balao.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.025)}}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:0;cursor:pointer;font:600 15px Inter,sans-serif;padding:15px;border-radius:15px;background:linear-gradient(120deg,var(--noite),var(--azul));color:var(--dourado);text-decoration:none;margin-top:16px;box-shadow:0 12px 24px -12px rgba(19,38,68,.8);transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn.leve{background:transparent;color:var(--marinho);border:1px solid #d8cdb8;box-shadow:none}
.btn svg{width:20px;height:20px}
.info{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eadfcb;font-size:14px}
.info small{display:block;font-size:11.5px;color:#6b7f94}

.flutuante{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 10px 24px rgba(10,60,30,.5);z-index:5;transform:scale(0);animation:entra .5s cubic-bezier(.5,1.6,.4,.9) 1.8s forwards}
.flutuante:before{content:"";position:absolute;inset:0;border-radius:50%;background:#25d366;z-index:-1;animation:onda 2.4s 2.4s infinite}
.flutuante svg{width:29px;height:29px;color:#fff}
@keyframes entra{to{transform:scale(1)}}
@keyframes onda{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.7);opacity:0}}



/* A · revelação ao rolar */
.cartao.revela{opacity:0;transform:translateY(70px) rotate(-2.5deg) scale(.94);animation:none;
  transition:opacity .7s ease,transform 1s cubic-bezier(.2,.85,.25,1)}
.cartao.revela.inv{transform:translateY(70px) rotate(2.5deg) scale(.94)}
.cartao.revela.visivel{opacity:1;transform:none}
.cartao.revela .img{opacity:0;transform:scale(.55) rotate(-10deg);
  transition:opacity .45s ease .3s,transform .9s cubic-bezier(.34,1.7,.5,1) .3s}
.cartao.revela.visivel .img{opacity:1;transform:rotate(3deg)}
.cartao.revela.inv.visivel .img{transform:rotate(-3deg)}
.cartao.revela .t1,.cartao.revela .t2,.cartao.revela .desc,.cartao.revela .acao{opacity:0;transform:translateY(10px);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
.cartao.revela.visivel .t1{opacity:1;transform:none;transition-delay:.15s}
.cartao.revela.visivel .t2{opacity:1;transform:none;transition-delay:.25s}
.cartao.revela.visivel .desc{opacity:1;transform:none;transition-delay:.35s}
.cartao.revela.visivel .acao{opacity:1;transform:none;transition-delay:.45s}
.cartao.revela .folhinha{opacity:0;transition:opacity .6s .7s}
.cartao.revela.visivel .folhinha{opacity:1}
.cartao.revela.visivel.pronto{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.cartao.revela.visivel.pronto .img{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.cartao.revela.visivel.pronto:hover{transform:translateY(-5px) rotate(-.4deg)}
.cartao.revela.visivel.pronto:hover .img{transform:rotate(0) scale(1.04)}
.sobre.revela{opacity:0;transform:translateY(50px);animation:none;transition:opacity .8s,transform 1s cubic-bezier(.2,.85,.25,1)}
.sobre.revela.visivel{opacity:1;transform:none}



/* A2 · (1) linha dourada que se desenha a partir do centro */
.linha-ouro.surge{opacity:1;transform:scaleX(0);animation:desenha 1.1s cubic-bezier(.65,0,.25,1) .75s forwards;position:relative;overflow:visible}
@keyframes desenha{to{transform:scaleX(1)}}
.linha-ouro:after{content:"";position:absolute;top:-2px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#fff5dc;
  box-shadow:0 0 8px 2px rgba(230,201,143,.9);opacity:0;animation:faisca 1.1s ease-out 1.6s forwards}
@keyframes faisca{30%{opacity:1}100%{opacity:0;transform:scale(.3)}}

/* A2 · (2) resposta ao toque: o cartão afunda e uma onda dourada se espalha */
.cartao .t1,.cartao .t2,.cartao .desc,.cartao .acao{position:relative;z-index:1}
.cartao .img{z-index:2}
.cartao .folhinha{z-index:3}
.cartao .toque{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.cartao .toque i{position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(230,201,143,.55),rgba(230,201,143,.25) 55%,transparent 70%);
  transform:translate(-50%,-50%) scale(0);animation:onda-toque .65s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes onda-toque{0%{transform:translate(-50%,-50%) scale(0);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.cartao.revela.visivel.pronto:active{transform:scale(.975);transition:transform .12s ease}



/* botão do WhatsApp: flutua de leve + luz a cada 3s */
.flutuante{animation:entra .5s cubic-bezier(.5,1.6,.4,.9) 1.8s forwards,boiaWa 3s ease-in-out 2.3s infinite}
@keyframes boiaWa{0%,100%{translate:0 0}50%{translate:0 -4px}}
.flutuante svg{animation:inclinaWa 3s ease-in-out 2.3s infinite;transform-origin:50% 60%}
@keyframes inclinaWa{0%,100%{rotate:0deg}25%{rotate:-5deg}75%{rotate:5deg}}
.flutuante:before{background:rgba(37,211,102,.8);filter:blur(4px);opacity:0;animation:luzWa 3s ease-out 2.3s infinite}
@keyframes luzWa{0%{transform:scale(1);opacity:.75}45%{transform:scale(1.8);opacity:0}100%{transform:scale(1.8);opacity:0}}

</style>
</head>
<body>

<!-- folha decorativa reutilizável -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="folha" viewBox="0 0 100 60">
      <path d="M2 58C18 20 52 2 98 4 84 40 50 60 2 58Z" fill="currentColor"/>
      <path d="M4 56C30 40 60 22 96 6" stroke="rgba(255,255,255,.45)" stroke-width="1.6" fill="none"/>
    </symbol>
  </defs>
</svg>

<div class="deco" id="deco">
  <div class="brilho"></div>
  <svg class="ondas-topo" viewBox="0 0 200 200" fill="none" stroke="#e6c98f" stroke-width="1">
    <circle cx="100" cy="100" r="96" stroke-dasharray="2 6"/><circle cx="100" cy="100" r="78"/><circle cx="100" cy="100" r="60" stroke-dasharray="1 4"/>
  </svg>
  <div class="ondas">
    <svg viewBox="0 0 1440 200" preserveAspectRatio="none"><path fill="#8cc8f5" d="M0,100 C120,60 240,60 360,100 C480,140 600,140 720,100 C840,60 960,60 1080,100 C1200,140 1320,140 1440,100 L1440,200 L0,200Z"/></svg>
    <svg viewBox="0 0 1440 200" preserveAspectRatio="none"><path fill="#5f9cc0" d="M0,120 C120,80 240,80 360,120 C480,160 600,160 720,120 C840,80 960,80 1080,120 C1200,160 1320,160 1440,120 L1440,200 L0,200Z"/></svg>
    <svg viewBox="0 0 1440 200" preserveAspectRatio="none"><path fill="#1f3a5f" d="M0,150 C120,125 240,125 360,150 C480,175 600,175 720,150 C840,125 960,125 1080,150 C1200,175 1320,175 1440,150 L1440,200 L0,200Z"/></svg>
  </div>
</div>

<div class="pagina">
  <header class="hero">
    <div class="hero-foto surge" style="--i:0">
      <img id="foto" alt="">
      <div class="arco"></div>
      <span class="selo-crp" id="crp"></span>
    </div>
    <h1 class="nome surge" style="--i:1"><span class="n1" id="n1"></span><span class="n2" id="n2"></span></h1>
    <div class="prof surge" style="--i:2" id="prof"></div>
    <div class="linha-ouro surge" style="--i:3"></div>
    <p class="frase surge" style="--i:3" id="frase"></p>
    <div class="status surge" style="--i:4"><i></i><span id="status"></span></div>
    <nav class="icones surge" style="--i:5">

<script>
/* ==========================================================

const CONFIG = {

  frase: "Um espaço seguro para você ser ouvida, <b>no seu tempo</b>.",
  status: "Agenda aberta para novos pacientes",
  whatsapp: "5500000000000",
  instagram: "https://instagram.com/",
  email: "contato@exemplo.com",
  endereco: "Praça da Sé, São Paulo",
  horarios: "Seg a sex, 8h às 20h",
  local: "No consultório, em ambiente reservado",
  bio: "Acompanho adultos que querem entender melhor suas emoções, relações e escolhas. Meu trabalho é oferecer uma escuta acolhedora, ética e sem julgamentos.",
  temas: ["Ansiedade", "Autoestima", "Relacionamentos", "Luto", "Trabalho", "Autoconhecimento"],
  abordagem: "Trabalho com Terapia Cognitivo-Comportamental (TCC). Sessões de 50 minutos, geralmente semanais, com recibo para reembolso.",
  faq: [
    ["Como sei se preciso de terapia?", "Não é preciso estar em crise. Se algo tem pesado no seu dia a dia, já é um bom motivo para conversar."],
    ["Atendimento online funciona?", "Sim, com a mesma seriedade e sigilo do presencial. Basta um lugar reservado e boa conexão."],
    ["Você atende convênio?", "O atendimento é particular, com recibo para você pedir reembolso ao seu plano."],
    ["O que eu falo fica em sigilo?", "Sim. O sigilo é um dever ético do psicólogo."]
  ],
  // cartões em ordem de importância. estilo: "" | "inv" (foto à esquerda) | "redondo"
  cartoes: [
    { id: "agendar", t1: "Agende sua", t2: "primeira conversa", desc: "Online ou presencial, no horário que funciona para você.", acao: "Agendar", estilo: "",
      imagem: "https://images.unsplash.com/photo-1573497491208-6b1acb260507?w=400&h=440&fit=crop&q=70" },
    { id: "atendimento", t1: "Como funciona", t2: "o atendimento", desc: "Abordagem, modalidades e dúvidas frequentes.", acao: "Saiba mais", estilo: "inv", folhinha: true,
      imagem: "https://images.unsplash.com/photo-1758273240331-745ccab011a2?w=400&h=440&fit=crop&q=70" },
    { id: "endereco", t1: "Conheça o", t2: "consultório", desc: "Um ambiente acolhedor e reservado para você.", acao: "Ver local", estilo: "redondo",
      imagem: "https://images.unsplash.com/photo-1637245048732-adf1a547835e?w=300&h=300&fit=crop&q=70" }
  ]
};

/* ========= daqui para baixo não precisa mexer ========= */
const $ = s => document.querySelector(s);
const wa = t => `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(t)}`;
const pn = CONFIG.nome;
const folhaSvg = (cor) => `<svg viewBox="0 0 100 60" style="color:${cor}"><use href="#folha"/></svg>`;

document.title = `${CONFIG.nome} ${CONFIG.sobrenome} · ${CONFIG.profissao}`;
$("#foto").src = CONFIG.foto; $("#foto").alt = `${CONFIG.nome} ${CONFIG.sobrenome}`;
$("#n1").textContent = CONFIG.nome; $("#n2").textContent = CONFIG.sobrenome;
$("#prof").textContent = CONFIG.profissao;
$("#crp").textContent = CONFIG.crp;
$("#frase").innerHTML = CONFIG.frase;
$("#status").textContent = CONFIG.status;
$("#bio").textContent = CONFIG.bio;
$("#temas").innerHTML = CONFIG.temas.map(t => `<span class="tema">${t}</span>`).join("");
$("#assinatura").textContent = CONFIG.nome;
$("#rodape").textContent = `${CONFIG.nome} ${CONFIG.sobrenome} · ${CONFIG.crp}`;
$("#icWa").href = $("#flutuante").href = wa(`Olá, ${pn}! Vi sua página e gostaria de agendar uma consulta.`);
$("#icIg").href = CONFIG.instagram;
$("#icMail").href = `mailto:${CONFIG.email}`;

$("#cartoes").innerHTML = CONFIG.cartoes.map((c, i) => `
  <button class="cartao surge ${c.estilo}" style="--i:${6 + i}" data-abrir="${c.id}">
    <span class="t1">${c.t1}</span><span class="t2">${c.t2}</span>
    <span class="desc">${c.desc}</span>
    <span class="acao">${c.acao}</span>
    <span class="img"><img src="${c.imagem}" alt="" loading="lazy"></span>
    ${c.folhinha ? `<span class="folhinha">${folhaSvg("#c9a45c")}</span>` : ""}
  </button>`).join("");

/* decorações do fundo: folhas e estrelinhas */
const deco = $("#deco");
[[ "-18px", "18%", 90, .35, -30, "#e6c98f", 11 ], [ "82%", "8%", 70, .3, 160, "#8fdde0", 9 ],
 [ "88%", "52%", 80, .28, 200, "#e6c98f", 12 ], [ "-10px", "68%", 64, .3, 10, "#8cc8f5", 10 ]]
.forEach(([l, t, tam, op, rot, cor, vel]) => {
  const f = document.createElement("div");
  f.className = "folha-deco";
  f.style.cssText = `left:${l};top:${t};--t:${tam}px;--o:${op};--r:${rot}deg;--v:${vel}s`;
  f.innerHTML = folhaSvg(cor);
  deco.append(f);
});
for (let i = 0; i < 18; i++) {
  const e = document.createElement("i");
  e.className = "estrela";
  e.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 80}%;animation-delay:-${Math.random() * 3}s;animation-duration:${2 + Math.random() * 3}s`;
  deco.append(e);
}

/* painel */
const painel = $("#folhaPainel"), veu = $("#veu"), conteudo = $("#conteudo");
function preencher(raiz) {
  raiz.querySelectorAll("[data-c]").forEach(el => {
    const k = el.dataset.c;
    if (k === "faq") el.innerHTML = CONFIG.faq.map(([q, r]) => `<details><summary>${q}</summary><p>${r}</p></details>`).join("");
    else if (k === "mapa") el.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(CONFIG.endereco)}`;
    else el.textContent = CONFIG[k];
  });
}
function abrir(id) {
  const t = document.getElementById("t-" + id);
  if (!t) return;
  conteudo.innerHTML = "";
  conteudo.append(t.content.cloneNode(true));
  preencher(conteudo);
  painel.classList.remove("on"); void painel.offsetWidth;
  painel.scrollTop = 0;
  painel.classList.add("on"); veu.classList.add("on");
  document.body.style.overflow = "hidden";
  if (id === "agendar") ligarFormulario();
}
function fechar() { painel.classList.remove("on"); veu.classList.remove("on"); document.body.style.overflow = ""; }
document.addEventListener("click", e => { const b = e.target.closest("[data-abrir]"); if (b) abrir(b.dataset.abrir); });
veu.onclick = fechar; $("#fechar").onclick = fechar;
document.addEventListener("keydown", e => e.key === "Escape" && fechar());

function montar() {
  const nome = $("#fNome").value.trim();
  const mod = document.querySelector("input[name=mod]:checked").value;
  const per = [...document.querySelectorAll("input[name=per]:checked")].map(i => i.value);
  const msg = $("#fMsg").value.trim();
  let t = `Olá, ${pn}! ${nome ? `Sou ${nome}. ` : ""}Vi sua página e gostaria de agendar uma consulta.\n\n• Atendimento: ${mod}`;
  if (per.length) t += `\n• Melhor período: ${per.join(", ")}`;
  if ($("#fPrimeira").checked) t += `\n• É minha primeira vez em terapia`;
  if (msg) t += `\n\n${msg}`;
  return t;
}
function ligarFormulario() {
  const atualizar = () => { const b = $("#balao"); b.textContent = montar(); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); };
  conteudo.addEventListener("input", atualizar);
  $("#enviar").onclick = () => window.open(wa(montar()), "_blank");
  $("#valores").href = wa(`Olá, ${pn}! Poderia me informar os valores das sessões?`);
  atualizar();
}

/* A · revelação ao rolar */
(function(){
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  scrollTo(0, 0);
  const alvos =[...document.querySelectorAll('.cartao'), document.querySelector('.sobre')];
  alvos.forEach(el => { el.classList.remove('surge'); el.classList.add('revela'); });
  const obs = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const el = e.target;
    el.classList.add('visivel');
    setTimeout(() => el.classList.add('pronto'), 1400);   // libera o hover depois da entrada
    obs.unobserve(el);
  }), { threshold: .22, rootMargin: '0px 0px -40px 0px' });
  alvos.forEach(el => obs.observe(el));

  /* parallax: a foto do topo desce mais devagar e o nome sobe um pouco */
  const foto = document.querySelector('#foto'), nome = document.querySelector('.nome');
  /* o movimento persegue a rolagem com suavidade, então fica fluido
     mesmo quando o aparelho rola "aos pulos" (efeitos visuais desligados) */
  let atual = Math.min(scrollY, 600), ativo = false;
  function passo(){
    const alvo = Math.min(scrollY, 600);
    atual += (alvo - atual) * .14;
    if (Math.abs(alvo - atual) < .2) atual = alvo;
    foto.style.translate = '0 ' + (atual * .35).toFixed(2) + 'px';
    nome.style.translate = '0 ' + (atual * -.08).toFixed(2) + 'px';
    if (atual !== alvo) requestAnimationFrame(passo); else ativo = false;
  }
  addEventListener('scroll', () => { if (!ativo) { ativo = true; requestAnimationFrame(passo); } }, { passive: true });
  passo();
})();

/* ROLAGEM SUAVE PRÓPRIA (rodinha do mouse no computador)
   Com "efeitos de animação" desligados, o Windows tira a rolagem suave do navegador
   e cada giro da rodinha pula ~100px. Aqui a página faz a rolagem suave sozinha.
   Touchpad e celular continuam com a rolagem nativa. */
(function(){
  let alvo = scrollY, rodando = false;
  const maximo = () => document.documentElement.scrollHeight - innerHeight;
  function loop(){
    const d = alvo - scrollY;
    if (Math.abs(d) < 1) { scrollTo(0, alvo); rodando = false; return; }
    let passo = d * .12;
    if (Math.abs(passo) < 1) passo = Math.sign(d);
    scrollTo(0, scrollY + passo);
    requestAnimationFrame(loop);
  }
  addEventListener('wheel', e => {
    if (e.ctrlKey || e.deltaX) return;                                  /* zoom ou rolagem lateral */
    if (document.body.style.overflow === 'hidden' || e.target.closest('.folha')) return; /* painel aberto */
    const rodinha = e.deltaMode === 1 || Math.abs(e.deltaY) >= 50;     /* touchpad manda passos pequenos */
    if (!rodinha) return;
    e.preventDefault();
    if (!rodando) alvo = scrollY;
    const passo = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY;
    alvo = Math.max(0, Math.min(maximo(), alvo + passo * 1.1));
    if (!rodando) { rodando = true; requestAnimationFrame(loop); }
  }, { passive: false });
  /* se a pessoa usar teclado ou barra de rolagem, sincroniza */
  addEventListener('keydown', () => { if (!rodando) alvo = scrollY; });
})();


/* A2 · resposta ao toque */
(function(){
  if (false) return;
  document.querySelectorAll('.cartao').forEach(c => {
    const camada = document.createElement('span');
    camada.className = 'toque';
    c.prepend(camada);
    c.addEventListener('pointerdown', e => {
      const r = c.getBoundingClientRect();
      const o = document.createElement('i');
      o.style.left = (e.clientX - r.left) + 'px';
      o.style.top = (e.clientY - r.top) + 'px';
      const d = Math.ceil(Math.hypot(r.width, r.height) * 2) + 'px';   /* cobre o cartão inteiro */
      o.style.width = o.style.height = d;
      camada.append(o);
      setTimeout(() => o.remove(), 700);
    });
  });
})();


/* BLINDAGEM · se o aparelho travar ou pular animações (economia de energia,
   efeitos visuais desativados, navegador antigo), nada fica escondido */
(function(){
  const mostrar = el => { el.style.opacity = '1'; el.style.transform = 'none'; el.style.translate = 'none'; };
  /* 1. sem IntersectionObserver: revela todos os cartões de uma vez */
  if (!('IntersectionObserver' in window)) document.querySelectorAll('.revela').forEach(el => el.classList.add('visivel', 'pronto'));
  /* 2. confere se o relógio das animações está andando */
  const inicio = performance.now();
  const t0 = document.timeline ? document.timeline.currentTime : null;
  setTimeout(() => {
    const andou = document.timeline ? (document.timeline.currentTime - t0) : (performance.now() - inicio);
    const travado = !(andou > 500);
    /* 3. qualquer elemento de entrada que ainda esteja invisível depois de 3,5s aparece na hora */
    document.querySelectorAll('.surge, .linha-ouro, .flutuante').forEach(el => {
      const cs = getComputedStyle(el);
      if (travado || +cs.opacity < .05) mostrar(el);
    });
    if (travado) {
      document.querySelectorAll('.revela').forEach(el => el.classList.add('visivel', 'pronto'));
      document.querySelectorAll('.revela, .revela *').forEach(el => { el.style.transition = 'none'; });
    }
  }, 3500);
  /* 4. cartões revelados ao rolar: se a transição não rodar em 1,5s, aparecem do mesmo jeito */
  new MutationObserver(ms => ms.forEach(m => {
    const el = m.target;
    if (el.classList && el.classList.contains('visivel') && !el.dataset.vigiado) {
      el.dataset.vigiado = '1';
      setTimeout(() => {
        if (+getComputedStyle(el).opacity < .95) {
          el.style.transition = 'none';
          el.querySelectorAll('*').forEach(f => f.style.transition = 'none');
        }
      }, 1500);
    }
  })).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });
})();

</script>
